# Generic single-workspace Slack app manifest for tandem.
# Create an app at https://api.slack.com/apps using "From a manifest", then
# create a separate app-level token with the connections:write scope.
---
display_information:
  name: Alfred
  description: "Alfred: a private assistant in Slack."
  background_color: "#1d1f21"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Alfred
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - reactions:read
      - reactions:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_home_opened
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
